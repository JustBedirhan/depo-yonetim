{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h1>{{ t('edit') if product else t('add_product') }}</h1>
  <a href="{{ url_for('products') }}" class="btn btn-ghost">← {{ t('cancel') }}</a>
</div>

<div class="card form-card">
  <form method="POST">
    <div class="field">
      <label>{{ t('product_name') }} *</label>
      <input type="text" name="name" required
             value="{{ product.name if product else '' }}"
             placeholder="Örn: A4 Kağıt">
    </div>

    <div class="field">
      <label>{{ t('category') }}</label>
      <input type="text" name="category"
             value="{{ product.category if product else '' }}"
             placeholder="Örn: Kırtasiye">
    </div>

    <div class="field-row">
      {% if not product %}
      <div class="field">
        <label>{{ t('stock') }}</label>
        <input type="number" name="stock" value="0" min="0">
      </div>
      {% endif %}
      <div class="field">
        <label>{{ t('min_stock') }}</label>
        <input type="number" name="min_stock"
               value="{{ product.min_stock if product else 5 }}" min="0">
      </div>
      <div class="field">
        <label>{{ t('unit') }}</label>
        <input type="text" name="unit"
               value="{{ product.unit if product else 'adet' }}"
               placeholder="adet, kg, lt...">
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('products') }}" class="btn btn-ghost">{{ t('cancel') }}</a>
      <button type="submit" class="btn btn-primary">{{ t('save') }}</button>
    </div>
  </form>
</div>

{% endblock %}
